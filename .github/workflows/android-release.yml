name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-${{ runner.os }}-${{
              hashFiles(
                'android/**/*.gradle*',
                'android/gradle.properties',
                'android/**/gradle-wrapper.properties',
                'package.json',
                'pnpm-lock.yaml'
              )
            }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOMIJI_KEYSTORE_BASE64"
          test -n "$YOMIJI_KEYSTORE_PASSWORD"
          printf '%s' "$YOMIJI_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          chmod 600 android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$YOMIJI_KEYSTORE_PASSWORD" -alias yomiji
        env:
          YOMIJI_KEYSTORE_BASE64: ${{ secrets.YOMIJI_KEYSTORE_BASE64 }}
          YOMIJI_KEYSTORE_PASSWORD: ${{ secrets.YOMIJI_KEYSTORE_PASSWORD }}

      - name: Build APKs
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          # ABI splits produce app-armeabi-v7a-release.apk and app-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "$OUT/yomiji-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$OUT/yomiji-arm64-v8a.apk"
          ls -lh "$OUT"
        env:
          CI_RELEASE_BUILD: "true"
          # Build only real-device ABIs; skip emulator-only x86/x86_64 to cut native compile time.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a"
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.YOMIJI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: yomiji
          KEY_PASSWORD: ${{ secrets.YOMIJI_KEYSTORE_PASSWORD }}

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in dist/yomiji-armeabi-v7a.apk dist/yomiji-arm64-v8a.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yomiji-armeabi-v7a.apk
            dist/yomiji-arm64-v8a.apk
          generate_release_notes: true
          body: |
            ## APKs

            | File | Architecture | Devices |
            | --- | --- | --- |
            | `yomiji-arm64-v8a.apk` | 64-bit ARM | Almost all phones from ~2017+ (recommended) |
            | `yomiji-armeabi-v7a.apk` | 32-bit ARM | Older / low-end devices only |

            Prefer **arm64-v8a** unless your device is 32-bit-only. Study Coach (TinySwallow / llama.rn) is arm64-only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
